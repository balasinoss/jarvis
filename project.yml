# XcodeGen project definition. The cloud build (GitHub Actions) turns this into
# Jarvis.xcodeproj, so nobody needs a Mac to keep the project file in sync.
name: Jarvis
options:
  bundleIdPrefix: com.jarvis
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true

packages:
  MWDAT:
    url: https://github.com/meta/meta-wearables-dat-ios
    exactVersion: 1.1.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Jarvis:
    type: application
    platform: iOS
    sources:
      - path: Jarvis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.glasses
        PRODUCT_NAME: Jarvis
        GENERATE_INFOPLIST_FILE: NO
        # "Free" variant: Bluetooth only (works with a free Apple ID).
        # The cloud build swaps this for Info-Paid.plist when you pick "paid".
        INFOPLIST_FILE: Info-Free.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - sdk: Contacts.framework
      - sdk: MessageUI.framework
      - sdk: UserNotifications.framework
      - sdk: AppIntents.framework
      - sdk: Speech.framework
