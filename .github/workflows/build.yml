name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: "free = free Apple ID (Bluetooth camera), paid = $99 Apple Developer (Wi-Fi camera)"
        type: choice
        options: [free, paid]
        default: free

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      VARIANT: ${{ github.event.inputs.variant || 'free' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          if [ "$VARIANT" = "paid" ]; then
            EXTRA="INFOPLIST_FILE=Info-Paid.plist CODE_SIGN_ENTITLEMENTS=Jarvis-Paid.entitlements"
          else
            EXTRA="INFOPLIST_FILE=Info-Free.plist"
          fi
          set -o pipefail
          xcodebuild \
            -project Jarvis.xcodeproj \
            -scheme Jarvis \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            $EXTRA \
            build | tee build.log | grep -E "error:|warning: .*Jarvis/|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Jarvis.app

      - name: Package Jarvis.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Jarvis.app Payload/
          zip -qry Jarvis-${VARIANT}.ipa Payload
          ls -lh Jarvis-${VARIANT}.ipa

      - name: Upload Jarvis.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-${{ env.VARIANT }}-ipa
          path: Jarvis-${{ env.VARIANT }}.ipa
          retention-days: 30

      - name: Upload build log (for fixing errors)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
