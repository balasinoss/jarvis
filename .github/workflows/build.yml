# Builds the iPhone app on GitHub's free cloud Macs, so you never need your own Mac.
# Result: an unsigned Jarvis.ipa (download it from the run's "Artifacts" section)
# that you install with Sideloadly on Windows.
name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: "free = free Apple ID (Bluetooth camera), paid = $99 Apple Developer (Wi-Fi camera)"
        type: choice
        options: [free, paid]
        default: free

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      VARIANT: ${{ github.event.inputs.variant || 'free' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          if [ "$VARIANT" = "paid" ]; then
            EXTRA="INFOPLIST_FILE=Info-Paid.plist CODE_SIGN_ENTITLEMENTS=Jarvis-Paid.entitlements"
          else
            EXTRA="INFOPLIST_FILE=Info-Free.plist"
          fi
          xcodebuild \
            -project Jarvis.xcodeproj \
            -scheme Jarvis \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            $EXTRA \
            build > build.log 2>&1 || BUILD_FAILED=1
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -100 || true
          APP=build/Build/Products/Release-iphoneos/Jarvis.app
          if [ -n "$BUILD_FAILED" ] || [ ! -f "$APP/Info.plist" ] || [ ! -f "$APP/Jarvis" ]; then
            echo "Build failed"
            exit 1
          fi

      - name: Package Jarvis.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Jarvis.app Payload/
          zip -qry Jarvis-${VARIANT}.ipa Payload
          ls -lh Jarvis-${VARIANT}.ipa

      - name: Upload Jarvis.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-${{ env.VARIANT }}-ipa
          path: Jarvis-${{ env.VARIANT }}.ipa
          retention-days: 30

      - name: Report errors as an issue (so they can be read and fixed)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo '```'
            if [ -f build.log ]; then
              grep -E "error:" build.log | sed 's#/Users/runner/work/[^ ]*/Jarvis/#Jarvis/#' | sort -u | head -120 || true
              echo "----- last lines -----"
              tail -40 build.log
            else
              echo "No build.log (failed before compiling)."
            fi
            echo '```'
          } > report.md
          gh issue create --repo "${{ github.repository }}" --title "Build failed (run ${{ github.run_number }})" --body-file report.md

      - name: Upload build log (for fixing errors)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
